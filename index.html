<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0"><title>Brawlwinism</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the 16:9 game fills the window edge to edge. If the window isn't 16:9, the leftover space is plain black, like a letterbox. */
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: #000; color-scheme: light; }
.stage { position: fixed; inset: 0; display: grid; place-items: center; }
.screen { position: relative; }
canvas { display: block; width: 100%; height: 100%; outline: none; }
</style>

<div class="stage" id="stage">
  <div class="screen" id="screen">
    <canvas id="game" tabindex="0" aria-label="Brawlwinism"></canvas>
  </div>
</div>

<script>
(() => {
  // ---------------------------------------------------------------- setup
  const GW = 1280, GH = 720;          // game coordinates
  const S = 1.25;                      // rig units -> game px
  const INK = '#15120f';
  // Practice stage: floor runs from an open edge on the left into a wall on the right that goes up off-screen
  const WALL = 1180, PLAT = { x0: 150, x1: WALL, y: 540 };
  // The stage's drawn depth, built on one rule (how 2D platform fighters like Brawlhalla keep 3D-looking terrain clean): the drawn
  // silhouette of the terrain sits exactly on the collision lines, depth is only ever shown on surfaces that recede BEHIND the
  // fighters, and fighters are always drawn in front of the terrain, so nothing can ever clip through them.
  //  - floors: a top band d px above and below the walk line, so feet land mid-band; its ends stop square at the ledge (x = the
  //    collision edge), so standing right on the lip always has surface under you;
  //  - walls: the inner face sits just past the collision line (from WALL out to WALL + wd), so a fighter against the wall touches its
  //    back edge and never overlaps it;
  //  - lines going back (joints, board marks) run toward vp, which gives the perspective.
  // Every map with ledges and walls should be drawn the same way.
  const STAGE3D = { vp: [640, 150], d: 20, wd: 24 };
  const PLAYER_RGB = [92, 128, 166];  // P1: dull blue

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const screenEl = document.getElementById('screen');
  const view = { s: 1, dpr: 1 };

  function resize() {
    const r = stage.getBoundingClientRect();
    let w = r.width, h = w * 9 / 16;
    if (h > r.height) { h = r.height; w = h * 16 / 9; }
    w = Math.max(160, Math.round(w)); h = Math.round(w * 9 / 16);   // as big as fits the window
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    screenEl.style.width = w + 'px'; screenEl.style.height = h + 'px';
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    view.s = w / GW; view.dpr = dpr;
  }
  window.addEventListener('resize', resize);
  resize();
  window.__view = view;   // test hook: lets close-up screenshots render the canvas at a higher resolution

  // ---------------------------------------------------------------- tiny 2D matrix [a,b,c,d,e,f]
  const T = (x, y) => [1, 0, 0, 1, x, y];
  const R = (t) => { const c = Math.cos(t), s = Math.sin(t); return [c, s, -s, c, 0, 0]; };
  const Sc = (x, y) => [x, 0, 0, y, 0, 0];
  const mul = (m, n) => [
    m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1],
    m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
    m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
  const chain = (...ms) => ms.reduce(mul);
  const apply = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
  // a world-space vector expressed in a part's local space
  const localVec = (m, X, Y) => { const det = m[0] * m[3] - m[1] * m[2]; return [(m[3] * X - m[2] * Y) / det, (-m[1] * X + m[0] * Y) / det]; };

  // ---------------------------------------------------------------- noise + textures
  function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function vnoise(cells, seed) {
    const r = rng(seed), g = new Float32Array(cells * cells);
    for (let i = 0; i < g.length; i++) g[i] = r();
    const G = (i, j) => g[(j % cells) * cells + (i % cells)];
    const sm = t => t * t * (3 - 2 * t);
    return (u, v) => {
      const x = u * cells, y = v * cells, x0 = Math.floor(x), y0 = Math.floor(y);
      const sx = sm(x - x0), sy = sm(y - y0);
      const a = G(x0, y0) + (G(x0 + 1, y0) - G(x0, y0)) * sx;
      const b = G(x0, y0 + 1) + (G(x0 + 1, y0 + 1) - G(x0, y0 + 1)) * sx;
      return a + (b - a) * sy;
    };
  }
  function fbm(seed) {
    const a = vnoise(3, seed), b = vnoise(7, seed + 1), c = vnoise(17, seed + 2);
    return (u, v) => 0.62 * a(u, v) + 0.28 * b(u, v) + 0.10 * c(u, v);
  }
  // Flat layered washes with crisp darker tide lines and paper gaps (coffee-stain look).
  function stainTexture(rgb, seed, plain = false) {
    const N = 256, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const c2 = cv.getContext('2d'), img = c2.createImageData(N, N), d = img.data;
    const paper = [246, 241, 230];
    const mix = (p, q, t) => p.map((v, i) => v + (q[i] - v) * t);
    const layers = plain ? [
      { n: fbm(seed), t: 0.0, col: mix(rgb, paper, 0.5), a: 0.9 },
      { n: fbm(seed + 10), t: 0.47, col: mix(rgb, paper, 0.3), a: 0.7 },
    ] : [
      { n: fbm(seed), t: 0.22, col: mix(rgb, paper, 0.55), a: 0.9 },
      { n: fbm(seed + 10), t: 0.49, col: mix(rgb, paper, 0.25), a: 0.8 },
      { n: fbm(seed + 20), t: 0.60, col: rgb.map(v => v * 0.86), a: 0.75 },
    ];
    const edge = rgb.map(v => v * 0.55);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      let c = paper.slice();
      const u = x / N, v = y / N;
      for (const L of layers) {
        const n = L.n(u, v);
        if (n > L.t) {
          c = mix(c, L.col, L.a);
          if (n - L.t < 0.009) c = mix(c, edge, 0.75);   // tide line where the wash dried
        }
      }
      if (x % 3 === 0) c = c.map(v => v * 0.975);       // faint laid-paper lines
      const i = (y * N + x) * 4;
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
    c2.putImageData(img, 0, 0);
    const pat = ctx.createPattern(cv, 'repeat');
    pat.setTransform(new DOMMatrix().scale(0.32));
    return pat;
  }
  const stain = stainTexture(PLAYER_RGB, 7);
  const headStain = stainTexture(PLAYER_RGB, 11, true);  // calmer wash on the blank head so no blotch reads as a face

  // Dry-brush bristle streaks (tileable): bands of parallel hairlines with broken gaps, like a half-loaded brush.
  function dryBrushCanvas(seed) {
    const N = 128, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const c = cv.getContext('2d'), r = rng(seed);
    c.fillStyle = INK;
    const bar = (x, y, w, h) => { for (const ox of [0, -N]) for (const oy of [0, -N]) c.fillRect(x + ox, y + oy, w, h); };
    // one bristle per row: long dark runs broken by small dry gaps, some rows starved of ink
    for (let y = 0; y < N; y += 2.6 + r() * 1.4) {
      const th = 0.9 + r() * 1.5, starve = r() < 0.22;
      let x = r() * N, run = 0;
      while (run < N) {
        const len = starve ? 3 + r() * 14 : 14 + r() * 70, gap = starve ? 6 + r() * 20 : (r() < 0.8 ? 1 + r() * 3 : 6 + r() * 14);
        bar(((x % N) + N) % N, y, len, th);
        x += len + gap; run += len + gap;
      }
    }
    return cv;
  }
  const brushCv = dryBrushCanvas(5);
  const mkBrush = (deg) => { const p = ctx.createPattern(brushCv, 'repeat'); p.setTransform(new DOMMatrix().rotate(deg).scale(0.3)); return p; };
  window.__dbg = { brushCv, get granCv() { return granCv; }, get forming() { return forming; }, get drops() { return drops; } };
  const BRUSH = { limb: mkBrush(90), torso: mkBrush(-62), head: mkBrush(24), foot: mkBrush(4) };

  // Ink granulation for the aura wash: pigment settling unevenly into the paper.
  function granCanvas(seed) {
    const N = 128, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const c = cv.getContext('2d'), img = c.createImageData(N, N), d = img.data, n = fbm(seed), r = rng(seed);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const v = n(x / N, y / N), i = (y * N + x) * 4;
      const a = 0.4 + 0.6 * Math.min(1, Math.max(0, (v - 0.3) / 0.32));
      d[i] = 21; d[i + 1] = 18; d[i + 2] = 15; d[i + 3] = 255 * a * (0.82 + 0.18 * r());
    }
    c.putImageData(img, 0, 0);
    return cv;
  }
  const granCv = granCanvas(19);

  // ---------------------------------------------------------------- fighter parts (rig units, pivot at 0,0, limbs hang along +y)
  // fill = closed silhouette (also drives the liquid aura); ink = inner brush line (joins left open so parts flow together);
  // deco = solid ink marks; thin = fine lines; brush = direction of the dry-brush shading
  const FIST = 'M-4.5,12.5 L-6.5,15.5 L-6.5,21.5 L-4,24.5 L4.5,24.5 L7,21.5 L6.8,15 L4.5,12.5 Z';
  const SRC = {
    torso: {
      fill: 'M-5,1 L-6,-7 L-10,-15 L-12,-22.5 L-7,-27.5 L6,-27.5 L13,-21 L9.5,-12 L5.5,-6 L5,1 Z',
      ink: 'M-5,1 L-6,-7 L-10,-15 L-12,-22.5 L-7,-27.5 L6,-27.5 L13,-21 L9.5,-12 L5.5,-6 L5,1',
      deco: 'M-10.4,-15.5 L-6,-13.5 L-9.4,-11.5 Z',
      thin: 'M13,-21 L4,-17.5 L5.5,-7.5',
      brush: 'torso', shade: 3.2,
    },
    head: {
      // angular helm: visor blade at the front, notched jaw, swept spike rising off the top-back
      fill: 'M-2,0 L9,-1 L18,-7 L14.5,-11 L24.5,-17.5 L14,-27.5 L2,-33 L-9.5,-38.5 L-8,-29 L-13,-20 L-8.5,-8 Z',
      ink: 'M-2,0 L9,-1 L18,-7 L14.5,-11 L24.5,-17.5 L14,-27.5 L2,-33 L-9.5,-38.5 L-8,-29 L-13,-20 L-8.5,-8 Z',
      thin: 'M14.5,-11 L5,-14.5 M14,-27.5 L9,-17.5',
      brush: 'head', shade: 3.8,
    },
    upperArm: {
      fill: 'M-3.8,0 L0,-4.6 L3.8,0 L4.6,8 L3.5,17 L-3.5,17 L-4.6,8 Z',
      ink: 'M-3.8,0 L-4.6,8 L-3.5,17 M3.8,0 L4.6,8 L3.5,17',
      brush: 'limb',
    },
    lowerArm: {
      fill: 'M-3.6,0 L-2,-3.6 L2,-3.6 L3.6,0 L4.6,3 L10.5,0.5 L6.4,6.5 L12,7 L6.8,12.5 L6.8,15 L7,21.5 L4.5,24.5 L-4,24.5 L-6.5,21.5 L-6.5,15.5 L-5.5,13 L-4.6,6 Z',
      ink: 'M-5.5,13 L-4.6,6 L-3.6,0 L-2,-3.6 L2,-3.6 L3.6,0 L4.6,3 L10.5,0.5 L6.4,6.5 L12,7 L6.8,12.5 ' + FIST,
      deco: 'M-6.5,15.5 L-1.5,18 L-0.5,15 L-2.5,17 Z',
      thin: 'M-6.3,18.5 L-1,19.5 L0.5,16 M-2.5,24.3 L-2.5,21.5 M1,24.3 L1,21.5 M4.3,24.3 L4.3,21.5',
      brush: 'limb',
    },
    upperLeg: {
      fill: 'M-5.5,0 L0,-5.5 L5.5,0 L6.2,8 L4.3,17 L-4.3,17 L-6.4,8 Z',
      ink: 'M-5.5,0 L-6.4,8 L-4.3,17 M5.5,0 L6.2,8 L4.3,17',
      deco: 'M-6.2,6 L-2.4,9.5 L-5.8,11 Z',
      brush: 'limb',
    },
    lowerLeg: {   // shin: knee cap on top, open at the ankle so it pours into the foot
      fill: 'M-4.4,0 L-2.4,-4 L2.4,-4 L4.4,0 L4.3,8 L3.4,13.5 L-3.4,13.5 L-4.8,8 Z',
      ink: 'M3.9,10.5 L4.3,8 L4.4,0 L2.4,-4 L-2.4,-4 L-4.4,0 L-4.8,8 L-4.2,10.5',
      deco: 'M4.1,4 L0.6,7.5 L4,8.5 Z',
      brush: 'limb',
    },
    foot: {       // pivot at the ankle so the sole can stay flat while the knee bends
      fill: 'M-4.3,-2.5 L3.9,-2.5 L5.3,1 L16,8 L-4.5,8 L-6.2,4.5 L-4.9,0.5 Z',
      ink: 'M-4.5,-1.5 L-4.9,0.5 L-6.2,4.5 L-4.5,8 L16,8 L5.3,1 L4.5,-1',
      brush: 'foot', shade: 2.2,
    },
  };
  const P2 = (s) => s ? new Path2D(s) : null;
  const PARTS = {};
  for (const [k, v] of Object.entries(SRC)) PARTS[k] = { fill: P2(v.fill), ink: P2(v.ink), deco: P2(v.deco), thin: P2(v.thin), brush: v.brush, shade: v.shade || 2.5 };
  const LEN = { upperArm: 17, upperLeg: 17, lowerLeg: 12 };
  const FIST_C = [0, 19];            // fist centre in lowerArm space
  const SOLE = [[-5, 8], [16, 8]];   // heel, toe in foot space
  const SOLE_TIP = [[-5, 8], [16, 8], [21, 6]];   // plus the pointed toe tip, for the slide

  // ---------------------------------------------------------------- poses (radians; limbs: negative = swing forward)
  // ff/bf = front/back foot angle relative to the ground (positive = toe down)
  const KEYS = ['tl', 'hd', 'fa1', 'fa2', 'ba1', 'ba2', 'fl1', 'fl2', 'bl1', 'bl2', 'ff', 'bf', 'dx', 'sp'];
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixPose = (a, b, t) => { const o = {}; for (const k of KEYS) o[k] = lerp(a[k], b[k], t); return o; };

  // two-bone leg IK: hip -> ankle target (rig units), knee bends forward
  function ik(tx, ty) {
    const L1 = LEN.upperLeg, L2 = LEN.lowerLeg;
    const d = Math.min(L1 + L2 - 0.05, Math.hypot(tx, ty));
    const phi = Math.atan2(-tx, ty);
    const A = Math.acos(Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
    const a1 = phi - A;
    const kx = -Math.sin(a1) * L1, ky = Math.cos(a1) * L1;
    return [a1, Math.atan2(-(tx - kx), ty - ky) - a1];
  }

  // Fighting stance: feet planted wide, knees sink and spring back in a steady bounce; guard and head follow a beat late.
  const BOB_W = 7.4;
  function idlePose(t, deep = 0) {
    const ph = t * BOB_W;
    const b = 0.5 - 0.5 * Math.cos(ph);            // 0 = top of the bounce, 1 = deepest knee bend
    const bl = 0.5 - 0.5 * Math.cos(ph - 0.75);    // the upper body lags behind the legs
    const D = 26 - 2.8 * b * (1 - deep * 0.6) - 14.5 * deep;   // hip-to-ankle height (deep = crouch)
    const [fl1, fl2] = ik(8.5, D);                 // front foot ahead, knee over the toes
    const [bl1, bl2] = ik(-12.5, D);               // back foot braced behind
    return { tl: 0.15 + 0.05 * bl + 0.42 * deep, hd: -0.08 - 0.05 * bl - 0.3 * deep,
      fa1: -0.72 + 0.08 * bl, fa2: -1.6 - 0.14 * bl, ba1: -0.2 + 0.07 * bl, ba2: -2.05 - 0.1 * bl,
      fl1, fl2, bl1, bl2, ff: 0, bf: 0, dx: 0, sp: 0 };
  }
  // first steps: an upright, guarded walk
  function walkPose(p) {
    const leg = (q) => [-(0.05 + 0.45 * Math.sin(q)), 0.15 + 0.75 * Math.max(0, Math.cos(q - 0.4)),
      0.3 * Math.max(0, -Math.sin(q - 0.5)) - 0.08 * Math.max(0, Math.sin(q))];
    const [f1, f2, f3] = leg(p), [b1, b2, b3] = leg(p + Math.PI);
    return { tl: 0.12, hd: -0.1,
      fa1: -0.65 + 0.28 * Math.sin(p), fa2: -1.7, ba1: -0.2 - 0.28 * Math.sin(p), ba2: -2.0,
      fl1: f1, fl2: f2, bl1: b1, bl2: b2, ff: f3, bf: b3, dx: 0, sp: 0 };
  }
  // full sprint: deep lean with the head driving forward, high knee drive, heel kicked up behind,
  // arms swept straight back and streamlined
  function sprintPose(p) {
    const leg = (q) => [-(0.15 + 1.1 * Math.sin(q)), 0.35 + 1.95 * Math.max(0, Math.cos(q - 0.55)),
      0.65 * Math.max(0, -Math.sin(q - 0.5)) - 0.1 * Math.max(0, Math.sin(q))];
    const [f1, f2, f3] = leg(p), [b1, b2, b3] = leg(p + Math.PI);
    return { tl: 0.62 + 0.03 * Math.sin(2 * p), hd: -0.42,
      fa1: 0.62 + 0.1 * Math.sin(p), fa2: -0.12, ba1: 0.8 - 0.1 * Math.sin(p), ba2: -0.08,
      fl1: f1, fl2: f2, bl1: b1, bl2: b2, ff: f3, bf: b3, dx: 0, sp: 0 };
  }
  const FLIP_T = 0.5;
  // ---- holding the sword. Angles here are in the body frame (0 = straight down, −π/2 = forward, +π/2 = back), so the stance holds
  // whatever the torso and arm are doing. scale = how much bigger than the traced asset it's drawn.
  //  - standing / walking: both hands on the grip in front, the blade angled up and out toward where you face;
  //  - sprinting or ground-dashing: one hand, the arm swept back and the blade trailing behind, tip just off the ground;
  //  - in the air (jumps, the somersault): one hand, arm as it is, the sword sitting naturally across the fist.
  //  - attacking: the blade lines up with the forearm, so the moves strike along it as before.
  const SWORD_HOLD = { scale: 1.7, guard: { fa1: -0.55, fa2: -1.05, ba1: -0.42, ba2: -1.0, abs: -2.22 }, trail: { fa1: 0.95, fa2: -0.05, abs: 1.12 }, air: -1.8,
    parry: { lead: [0.1, -1.0], off: [-0.53, -2.6], abs: -2.75, turnX: 1, turnY: 1 } };   // parry, a supported block: the lead hand holds the blade upright in front (lead = its upper arm / forearm angles in the body frame; abs = the blade's angle, ±π = straight up), and the off arm's forearm braces across the back of the blade's middle (off). turnX / turnY: no foreshortening
  function swordHold(f, tg) {
    const S_ = SWORD_HOLD, P_ = f.punch, nt = { ...tg };
    f.swordTurnTo = 0;
    if (f.parryT > 0 || f.lockT > 0) {   // the sword parry: hilt to the cheek in both hands, blade turned down across the body
      const Pp = S_.parry, jit = f.parryT > 0 ? 0.05 * Math.exp(-(PARRY_WIN - f.parryT) / 0.12) * Math.sin((PARRY_WIN - f.parryT) * 95) : 0;   // a quick shake as it comes up
      nt.hd = 0.07 - nt.tl;   // head kept upright (no duck)
      Object.assign(nt, { fa1: Pp.lead[0] - tg.tl + jit, fa2: Pp.lead[1] - Pp.lead[0], ba1: Pp.off[0] - tg.tl + jit, ba2: Pp.off[1] - Pp.off[0] });   // angles given in the body frame, made relative to the torso / the upper arm
      f.swordAim = { abs: Pp.abs, rate: 40 }; f.swordTurnTo = 1; return nt;
    }
    if (P_.on || f.staggerT > 0 || f.wallSlide) { f.swordAim = { rel: 0, rate: 30 }; return tg; }   // its own pose: the blade along the forearm
    const run = f.onGround && ((f.dashT > 0 && !f.dashAir) || f.slideT > 0 || (f.sprint > 0.55 && Math.abs(f.vx) > 220));
    if (!f.onGround && !(f.dashT > 0 && !f.dashAir)) { f.swordAim = { abs: S_.air, rate: 14 }; return tg; }   // jumps and the somersault: one hand, the arm as it is, blade out forward and a little up (it tumbles with the flip)
    if (run) { const T_ = S_.trail; nt.fa1 = T_.fa1 + 0.06 * Math.sin(f.run || 0); nt.fa2 = T_.fa2; f.swordAim = { abs: T_.abs, rate: 12 }; return nt; }
    const G_ = S_.guard, sway = 0.04 * Math.sin((f.time || 0) * BOB_W - 0.75);
    Object.assign(nt, { fa1: G_.fa1 + sway, fa2: G_.fa2, ba1: G_.ba1 + sway, ba2: G_.ba2 }); f.swordAim = { abs: G_.abs, rate: 16 };
    return nt;
  }
  const TUCK = { tl: 0.45, hd: 0.25, fa1: -1.35, fa2: -1.7, ba1: -1.05, ba2: -1.9, fl1: -1.95, fl2: 2.35, bl1: -1.6, bl2: 2.25, ff: 0.3, bf: 0.3, dx: 0, sp: 0 };
  const AIRDASH = { tl: 0.15, hd: -0.2, fa1: 0.5, fa2: -0.1, ba1: 0.7, ba2: -0.1, fl1: 0.25, fl2: 0.5, bl1: 0.55, bl2: 0.35, ff: 0.6, bf: 0.7, dx: 0, sp: 0 };
  // slide: leaning back, lead leg shot out flat along the floor, back leg tucked, trailing hand down

    ctx.fillStyle = ctx.strokeStyle = INK;
    ctx.lineJoin = 'round'; ctx.lineWidth = 2 * AUR.LIQ_W * S;
    ctx.fill(liq); ctx.stroke(liq);
    ctx.lineJoin = 'miter'; ctx.miterLimit = 4; ctx.lineWidth = 2 * AUR.CORE_W * S;
    ctx.fill(core); ctx.stroke(core);
  }

  // Air dash: the fighter collapses into a spinning black ink spike pointed along the dash.
  // Pale spiral grooves sweep along it to sell the spin, ragged ink tails whip behind, and ink sheds off it.
  const inDrill = () => pl.dashT > 0 && pl.dashAir;
  function drawDrill() {
    if (!inDrill() || !R0) return;
    const [cx, cy] = R0.centre, [dx, dy] = pl.dashV, nx = -dy, ny = dx;
    const p = 1 - pl.dashT / pl.dashDur, pop = Math.min(1, p / 0.15 + 0.4, (1 - p) / 0.12 + 0.5);
    const spin = pl.time * 50;
    // Envelope of the real body spun round the dash line: for each slice along the line,
    // the furthest any part of the fighter reaches from it. So the head bulges, the waist pinches, the feet trail.
    const NB = 26; let umin = 1e9, umax = -1e9;
    const pts = [];
    for (const inst of INST) for (const g of inst.rings) for (let i = 0; i < g.src.n; i++) {
      const ox = g.core[2 * i] - cx, oy = g.core[2 * i + 1] - cy, u = ox * dx + oy * dy, v = Math.abs(ox * nx + oy * ny);
      pts.push(u, v); if (u < umin) umin = u; if (u > umax) umax = u;
    }
    const span = Math.max(1, umax - umin), prof = new Float32Array(NB + 1);
    for (let i = 0; i < pts.length; i += 2) { const b = Math.round((pts[i] - umin) / span * NB); if (pts[i + 1] > prof[b]) prof[b] = pts[i + 1]; }
    const sm = Array.from(prof, (v, i) => (prof[Math.max(0, i - 1)] + 2 * v + prof[Math.min(NB, i + 1)]) / 4 * pop);
    sm[0] *= 0.5; sm[NB] *= 0.35;
    const P = (u, v) => [cx + dx * u + nx * v, cy + dy * u + ny * v];
    const us = Array.from({ length: NB + 1 }, (_, i) => umin + span * i / NB);
    const r = rng(Math.floor(pl.time * 24));   // brush jitter re-rolled a few times a second, like boiling line art
    setM(ID); ctx.fillStyle = INK;
    const top = us.map((u, i) => P(u, sm[i] + (r() - 0.5) * 1.2)), bot = us.map((u, i) => P(u, -sm[i] + (r() - 0.5) * 1.2));
    const body = new Path2D();
    top.forEach(([x, y], i) => i ? body.lineTo(x, y) : body.moveTo(x, y));
    for (let i = bot.length - 1; i >= 0; i--) body.lineTo(bot[i][0], bot[i][1]);
    body.closePath();
    ctx.fillStyle = stain; ctx.fill(body);                           // the fighter's own watercolour
    ctx.save(); ctx.clip(body);
    // spin read as motion: short brush streaks wrapping round the width, sliding as it turns
    for (let k = 0; k < 5; k++) {
      const i = Math.round(NB * (0.12 + k * 0.18)), w = sm[i], ph = spin + k * 1.7, c = Math.cos(ph);
      if (w < 3) continue;
      const arc = []; for (let j = 0; j <= 6; j++) { const t = ph - 1.1 + j * 0.37; arc.push(P(us[i] + Math.cos(t) * 3 - j * 0.8, Math.sin(t) * w * 0.95)); }
      ctx.fillStyle = `rgba(21,18,15,${0.55 + 0.45 * Math.max(0, c)})`;
      ctx.fill(brushPath(arc, 3 + 4 * Math.max(0, c), 0.15, 0.7, 0.3, 100 + k));
    }
    // shadow side: dry-brushed ink along the lower edge, thick-thin like the fighter's outline
    const shade = new Path2D(), sgn = (dy * nx - dx * ny > 0 ? 1 : -1);
    us.forEach((u, i) => { const [x, y] = P(u, -sm[i] * sgn); i ? shade.lineTo(x, y) : shade.moveTo(x, y); });
    ctx.strokeStyle = 'rgba(21,18,15,0.3)'; ctx.lineWidth = 16; ctx.lineJoin = 'round'; ctx.stroke(shade);
    ctx.strokeStyle = BRUSH.torso; ctx.stroke(shade);
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke(shade);
    ctx.restore();
    ctx.fillStyle = INK;   // bold brushed outline
    ctx.fill(brushPath(top.filter((_, i) => i % 2 === 0 || i === NB), 3.8, 0.08, 0.15, 0.5, 90));
    ctx.fill(brushPath(bot.filter((_, i) => i % 2 === 0 || i === NB), 3.8, 0.08, 0.15, 0.5, 91));
  }
  function teardrop(x, y, ux, uy, r, L) {
    const p = new Path2D(), ang = Math.atan2(uy, ux), b = Math.acos(Math.min(0.98, r / L));
    p.moveTo(x - ux * L, y - uy * L);
    p.arc(x, y, r, ang - Math.PI + b, ang + Math.PI - b);
    p.closePath();
    return p;
  }
  function drawDrops() {
    setM(ID);
    for (const d of drops) {
      ctx.fillStyle = d.c ? `rgb(${d.c})` : INK;
      const sp = Math.hypot(d.vx, d.vy) || 1, r = d.r * S;
      ctx.fill(teardrop(d.x, d.y, d.vx / sp, d.vy / sp, r, r * 1.8 + Math.min(14, sp * 0.016) * S));
    }
    for (const p of motes) {
      const k = p.life / p.max, sp = Math.hypot(p.vx, p.vy);
      ctx.fillStyle = `rgba(${p.c || '21,18,15'},${Math.min(1, k * 1.6) * 0.85})`;
      const r = p.r * S * (0.4 + 0.6 * k);
      if (sp > 70) {
        // fast flecks stretch into tiny streaks
        const ux = p.vx / sp, uy = p.vy / sp, Lr = Math.min(10, sp * 0.03) * S;
        ctx.fill(brushPath([[p.x - ux * Lr, p.y - uy * Lr], [p.x - ux * Lr * 0.5, p.y - uy * Lr * 0.5], [p.x, p.y]], r * 2, 0.6, 0.15, 0, 4));
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // parry cooldown: a small ink arc over the head that closes as it recharges, with a pop when ready
  function drawCooldown(r, f = pl) {
    const [hx, hy] = apply(r.head, 4, -46);
    setM(ID); ctx.lineCap = 'round';
    // air dash cooldown: a thin outer ring round the parry arc
    if (f.airDashCd > 0) {
      const p = 1 - f.airDashCd / AIR_DASH_CD;
      ctx.strokeStyle = 'rgba(21,18,15,0.14)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(hx, hy, 11.5, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(21,18,15,0.7)';
      ctx.beginPath(); ctx.arc(hx, hy, 11.5, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ctx.stroke();
    } else if (f.airReadyT > 0) {
      const q = f.airReadyT / 0.3;
      ctx.strokeStyle = `rgba(21,18,15,${0.8 * q})`; ctx.lineWidth = 1.6 * q + 0.4;
      ctx.beginPath(); ctx.arc(hx, hy, 11.5 + 7 * (1 - q), 0, Math.PI * 2); ctx.stroke();
    }
    if (f.parryCd <= 0 && f.readyT <= 0) return;
    if (f.parryCd > 0) {
      const p = 1 - f.parryCd / f.parryCdMax;
      ctx.strokeStyle = 'rgba(21,18,15,0.18)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(hx, hy, 7, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(21,18,15,0.8)';
      ctx.beginPath(); ctx.arc(hx, hy, 7, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); ctx.stroke();
    } else {
      const q = f.readyT / 0.3;
      ctx.strokeStyle = `rgba(21,18,15,${q})`; ctx.lineWidth = 3 * q + 0.5;
      ctx.beginPath(); ctx.arc(hx, hy, 7 + 8 * (1 - q), 0, Math.PI * 2); ctx.stroke();
    }
  }

  function drawFighter(r, f = pl, st = stain, hs = headStain, ink = INK) {
    const P_ = f.punch, A = P_.on ? P_.A : null;
    const crossFront = (A && A.limb === 'ba' && P_.t > A.wind && P_.t < A.end - 0.05) || (!f.wpn && (f.parryT > 0 || f.lockT > 0));   // parry X: both arms in front (with a sword the off arm stays behind the torso)
    const kickFront = A && A.limb === 'bl' && P_.t > A.wind * 0.4 && P_.t < A.end - 0.12;   // rear-leg kick swings round in front of the body
    if (!crossFront) {
      drawPart(PARTS.upperArm, r.ba.up, true, st, ink);
      drawPart(PARTS.lowerArm, r.ba.lo, true, st, ink);
    }
    for (const [side, back] of [['b', true], ['f', false]]) {
      if (side === 'b' && kickFront) continue;
      drawPart(PARTS.upperLeg, r.L[side].up, back, st, ink);
      drawPart(PARTS.foot, r.L[side].ft, back, st, ink);
      drawPart(PARTS.lowerLeg, r.L[side].lo, back, st, ink);
    }
    drawPart(PARTS.torso, r.torso, false, st, ink);
    if (kickFront) { drawPart(PARTS.upperLeg, r.L.b.up, false, st, ink); drawPart(PARTS.foot, r.L.b.ft, false, st, ink); drawPart(PARTS.lowerLeg, r.L.b.lo, false, st, ink); }
    drawPart(PARTS.head, r.head, false, hs, ink);
    if (crossFront) {
      drawPart(PARTS.upperArm, r.ba.up, false, st, ink);
      drawPart(PARTS.lowerArm, r.ba.lo, false, st, ink);
    }
    if (f.wpn && !(f.snipe && !f.snipe.wait)) drawSword(r.fa.lo, f.wpn, INK, f.swordW || 0, SWORD_HOLD.scale, f);   // (put away while the No Scope rifle is out)   // the weapon, under the lead hand: the fist wraps over its grip
    drawPart(PARTS.upperArm, r.fa.up, false, st, ink);
    drawPart(PARTS.lowerArm, r.fa.lo, false, st, ink);
  }

  function catmull(pts, n) {

  // the cursors, painted once into small images: an ink crosshair while fighting (for aiming abilities), and a dry-brush

        if (y < top[Math.min(top.length - 1, Math.round((x + 20) / 4))][1] + 3) continue;
        g.fillStyle = `rgba(66,62,56,${0.3 + r() * 0.4})`; g.beginPath(); g.ellipse(x, y, s * 1.4, s, r() - 0.5, 0, TAU); g.fill();
        g.fillStyle = 'rgba(236,232,224,0.35)'; g.beginPath(); g.ellipse(x - s * 0.3, y - s * 0.35, s * 0.5, s * 0.3, r() - 0.5, 0, TAU); g.fill();
      }
      g.fillStyle = 'rgba(66,62,56,0.3)';   // the sand carries on below the screen's edge, so lifting the shore never shows a gap
    }, HS.tide * 2 + 12);
    // mist banks: soft, long, pale; each drawn twice side by side so it can slide forever
    const mist = HS.mist.map(([y, h], i) => {   // three screens wide, the same puffs repeated each screen, so it wraps with no seam
      const c = document.createElement('canvas'); c.width = canvas.width * 3; c.height = canvas.height; const g = c.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0);
      const r = rng(400 + i), puffs = Array.from({ length: 11 }, (_, j) => [(j + r() * 0.8) * GW / 11, 120 + r() * 180, h * (0.3 + r() * 0.25)]);
      soft(g, h * 0.35, () => { g.fillStyle = rgba(HS.paper, 0.85); for (const rep of [0, 1, 2]) for (const [x, rx, ry] of puffs) { g.beginPath(); g.ellipse(x + rep * GW, y, rx, ry, 0, 0, TAU); g.fill(); } });
      return c;
    });
    // ripples on the lake: short pale and dark brush dashes, fixed shapes that drift and breathe
    const rr = rng(500), ripples = [];

      ripples.push({ x: rr() * GW, y, path: brushPath([[-len / 2, 0], [0, -0.6], [len / 2, 0]], w, 0.3, 0.3, 0, 510 + i), light: rr() < 0.55, ph: rr() * TAU, sp: 0.35 + rr() * 0.5, v: 3 + rr() * 6 });

    const qr = rng(700), reeds = [];
    for (const [cx, n0] of [[60, 9], [150, 5], [1170, 7], [1240, 10]]) for (let i = 0; i < n0; i++) {
      const h = 60 + qr() * 110 * (cx < 100 || cx > 1200 ? 1.2 : 0.8);
      reeds.push({ x: cx + (qr() - 0.5) * 70, y: GH + 6, h, lean: (qr() - 0.5) * 0.5 + (cx < 640 ? 0.12 : -0.12), w: 2 + qr() * 2.6, ph: qr() * TAU, sp: 0.6 + qr() * 0.5, head: qr() < 0.35, seed: 710 + reeds.length });

  }
  // the moving parts, over the still sky
  function drawHomeScene(t) {
    const k = view.s * view.dpr, L = homeL, H = HS.horizon;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(L.sky, 0, 0);
    // the water's level on the shore this moment: a slow swell in and out
    const tide = Math.sin(t * TAU / HS.tidePeriod) * HS.tide + Math.sin(t * TAU / (HS.tidePeriod * 0.43) + 1) * HS.tide * 0.25;
    // the reflection, in thin slices nudged side to side so it shimmers, more toward us
    for (let y = H; y < HS.shore + 20; y += 4) {
      const d = (y - H) / (HS.shore - H), dx = Math.sin(t * 1.1 + y * 0.21) * (0.6 + 2.4 * d) + Math.sin(t * 0.7 + y * 0.05) * 1.2;
      ctx.drawImage(L.refl, 0, y * k, canvas.width, 4 * k, dx * k, y * k, canvas.width, 4 * k);
    }
    setM(ID);
    for (const p of L.ripples) {   // ripples drift along and fade in and out
      const a = Math.max(0, Math.sin(t * p.sp + p.ph)), x = ((p.x + t * p.v) % (GW + 120) + GW + 120) % (GW + 120) - 60;
      if (a < 0.02) continue;
      setM([1, 0, 0, 1, x, p.y]); ctx.fillStyle = p.light ? `rgba(240,240,236,${0.55 * a})` : `rgba(96,110,126,${0.32 * a})`; ctx.fill(p.path);
    }
    setM(ID);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    HS.mist.forEach(([, , v], i) => {   // mist banks sliding between the ridges, each at its own pace
      const off = ((t * v) % GW + GW) % GW, img = L.mist[i];
      ctx.globalAlpha = 0.75 + 0.2 * Math.sin(t * 0.13 + i);
      ctx.drawImage(img, off * k - 2 * canvas.width, 0);   // the middle screen's worth of the strip, slid along
    });
    ctx.globalAlpha = 1;
    // the near shore, lifted and lowered by the water: when the water rises, it covers more of the sand
    ctx.drawImage(L.shore, 0, tide * k);
    setM(ID);
    const edge = L.shoreTop.map(([x, y]) => [x, y + 2 + tide + Math.sin(x * 0.02 + t * 0.9) * 1.4]);   // foam along the shore's own ragged edge
    ctx.fillStyle = 'rgba(244,243,238,0.7)'; ctx.fill(brushPath(edge, 2.2, 0.02, 0.02, 0.8, 520));   // a thin line of foam where the water laps
    ctx.fillStyle = 'rgba(244,243,238,0.35)'; ctx.fill(brushPath(edge.map(([x, y]) => [x, y - 5 - 2 * Math.sin(t * 0.6 + x * 0.05)]), 1.2, 0.05, 0.05, 0.6, 521));
    // reeds: each blade bends a little in a slow breeze, more toward its tip; some carry a seed head
    for (const q of L.reeds) {
      const sw = Math.sin(t * q.sp + q.ph) * 0.07 + Math.sin(t * 0.37 + q.x * 0.01) * 0.05, pts = [];
      for (let j = 0; j <= 4; j++) { const u = j / 4, b = (q.lean + sw * u) * u * u; pts.push([q.x + Math.sin(b) * q.h * u, q.y - Math.cos(b) * q.h * u]); }
      ctx.fillStyle = 'rgba(52,54,50,0.82)'; ctx.fill(brushPath(pts, q.w, 0.02, 0.85, 0, q.seed));
      if (q.head) { const [hx, hy] = pts[3], [ex, ey] = pts[4]; ctx.fill(brushPath([[hx, hy], [(hx + ex) / 2, (hy + ey) / 2], [ex, ey]], q.w * 2.4, 0.3, 0.4, 0, q.seed + 50)); }
    }
    // the flock: a slow figure-of-eight round the sky by the sun, each bird on its own beat, wings swept down and up
    const [fx, fy, frx, fry] = HS.flock;
    for (const b of L.birds) {
      const a = t * TAU / HS.loop + b.ph, x = fx + Math.sin(a) * frx + b.off[0] + Math.sin(t * 0.5 + b.ph * 3) * 8, y = fy + Math.sin(2 * a) * fry * 0.6 + b.off[1] + Math.cos(t * 0.7 + b.ph) * 5;
      const dir = Math.cos(a) >= 0 ? 1 : -1, w = Math.sin(t * b.flap + b.fp), s = b.s, tip = -s * (0.15 + 0.55 * w);
      ctx.fillStyle = 'rgba(42,44,50,0.62)';
      ctx.fill(brushPath([[x - s * dir, y + tip], [x - s * 0.45 * dir, y - s * 0.32 - w * s * 0.15], [x, y]], 1.7, 0.05, 0.15, 0, 530));
      ctx.fill(brushPath([[x, y], [x + s * 0.45 * dir, y - s * 0.32 - w * s * 0.15], [x + s * 0.9 * dir, y + tip * 0.9]], 1.5, 0.15, 0.6, 0, 531));
    }

  }
  function drawHome() {
    const key = canvas.width + 'x' + canvas.height;
    if (key !== homeKey) {

      const T_ = TITLE || (TITLE = buildTitle(GW / 2, 270));
      homeL.title = homeLayer(view.s * view.dpr, (g) => { g.fillStyle = INK; g.fill(T_.body); g.fill(T_.hairs); g.fill(T_.spat); });
    }
    drawHomeScene(home.t);
    SHX = SHY = 0; setM(ID);
    // title: the word painted with the bristle brush (TITLE, drawn into the backdrop), a loaded brush stroke under it that runs dry into bristle hairlines
    const T_ = TITLE || (TITLE = buildTitle(GW / 2, 270));   // (painted into the backdrop above)
    const tw = T_.w, l = T_.x0;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = INK;
    ctx.fill(brushPath([[l - 10, 300], [l + tw * 0.35, 303], [l + tw * 0.75, 299], [l + tw + 14, 301]], 13, 0.03, 0.45, 0.8, 901));
    const r = rng(905);
    for (let h = 0; h < 6; h++) {   // the dry tail splitting into bristles
      const y = 296 + h * 1.9, x0 = l + tw * (0.62 + r() * 0.1);
      ctx.fill(brushPath([[x0, y], [l + tw + 30 + r() * 30, y + (r() - 0.5) * 3], [l + tw + 50 + r() * 50, y + (r() - 0.3) * 5]], 1.3, 0.05, 0.6, 0.1, 910 + h));
    }
    HOME_ITEMS.forEach((it, i) => {
      const y = HROW0 + i * HROW, on = i === home.sel;
      ctx.font = `italic ${on ? 700 : 600} 32px Georgia, serif`; ctx.fillStyle = on ? INK : 'rgba(21,18,15,0.6)';
      ctx.fillText(it.label, GW / 2, y + 10);
      if (on) {
        const w = ctx.measureText(it.label).width, g = Math.min(1, home.selT / 0.14);
        ctx.fill(brushPath([[GW / 2 - w / 2 - 4, y + 20], [GW / 2 - w / 2 + w * 0.5 * g, y + 21], [GW / 2 - w / 2 + (w + 8) * g, y + 19]], 4, 0.05, 0.55, 0.3, 920 + i));
        focusTick(GW / 2 - w / 2 - 26, y, 930 + i);
      }
    });
    ctx.font = 'italic 500 17px Georgia, serif'; ctx.fillStyle = 'rgba(21,18,15,0.5)';
    ctx.fillText('Enter, Space or A to start', GW / 2, 640);
  }

  // ---------------------------------------------------------------- loop
  R0 = rig(); auraUpdate(R0, 0); bot.R = rig(bot); botInk(bot.R);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now; lastDt = menu.open ? 0 : dt;
    if (!pl.paused) {   // paused = a test is stepping frames by hand
      if (game.mode === 'home') { pollPad(); homeStep(dt); drawHome(); }
      else { if (menu.open) { pollPad(); menuStep(dt); } else update(dt); draw(); }
    }
    updateCursor();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
