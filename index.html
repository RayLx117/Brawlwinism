<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0"><title>Ink Fighter Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 16:9 stage centred on a paper desk, controls line underneath. Single deliberate paper theme. */
:root {
  --desk: #d8cdb8;
  --paper: #ece4d3;
  --ink: #15120f;
  --muted: #5b5247;
  --key: #f4eee2;
  --font: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--desk); color: var(--ink); font-family: var(--font); }
.wrap {
  height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage { position: relative; flex: 1 1 auto; width: 100%; min-height: 0; display: grid; place-items: center; }
.screen { position: relative; box-shadow: 0 1px 0 rgba(21,18,15,.25), 0 10px 30px rgba(21,18,15,.18); }
canvas { display: block; width: 100%; height: 100%; outline: none; }
.keys { margin: 0; color: var(--muted); font-size: .95rem; text-align: center; display: flex; flex-wrap: wrap; gap: .35em 1.2em; justify-content: center; }
kbd { font: 600 .8rem/1 var(--font); color: var(--ink); background: var(--key); border: 1px solid var(--ink); border-bottom-width: 2px; padding: .2em .45em; border-radius: 3px; }
</style>

<div class="wrap">
  <div class="stage" id="stage">
    <div class="screen" id="screen">
      <canvas id="game" tabindex="0" aria-label="Fighter prototype, Practice stage: floor with an open edge on the left and a wall on the right"></canvas>
    </div>
  </div>
  <p class="keys">
    <span><kbd>Esc</kbd> or <kbd>Start</kbd> pause: practice settings and controls</span>
  </p>
</div>

<script>
(() => {
  // ---------------------------------------------------------------- setup
  const GW = 1280, GH = 720;          // game coordinates
  const S = 1.25;                      // rig units -> game px
  const INK = '#15120f';
  // Practice stage: floor runs from an open edge on the left into a wall on the right that goes up off-screen
  const WALL = 1180, PLAT = { x0: 150, x1: WALL, y: 540 };
  const PLAYER_RGB = [92, 128, 166];  // P1: dull blue

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const screenEl = document.getElementById('screen');
  const view = { s: 1, dpr: 1 };

  function resize() {
    const r = stage.getBoundingClientRect();
    let w = r.width, h = w * 9 / 16;
    if (h > r.height) { h = r.height; w = h * 16 / 9; }
    w = Math.max(160, Math.floor(w)); h = Math.round(w * 9 / 16);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    screenEl.style.width = w + 'px'; screenEl.style.height = h + 'px';
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    view.s = w / GW; view.dpr = dpr;
  }
  window.addEventListener('resize', resize);
  resize();
  window.__view = view;   // test hook: lets close-up screenshots render the canvas at a higher resolution

  // ---------------------------------------------------------------- tiny 2D matrix [a,b,c,d,e,f]
  const T = (x, y) => [1, 0, 0, 1, x, y];
  const R = (t) => { const c = Math.cos(t), s = Math.sin(t); return [c, s, -s, c, 0, 0]; };
  const Sc = (x, y) => [x, 0, 0, y, 0, 0];
  const mul = (m, n) => [
    m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1],
    m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
    m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5]];
  const chain = (...ms) => ms.reduce(mul);
  const apply = (m, x, y) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
  // a world-space vector expressed in a part's local space
  const localVec = (m, X, Y) => { const det = m[0] * m[3] - m[1] * m[2]; return [(m[3] * X - m[2] * Y) / det, (-m[1] * X + m[0] * Y) / det]; };

  // ---------------------------------------------------------------- noise + textures
  function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function vnoise(cells, seed) {
    const r = rng(seed), g = new Float32Array(cells * cells);
    for (let i = 0; i < g.length; i++) g[i] = r();
    const G = (i, j) => g[(j % cells) * cells + (i % cells)];
    const sm = t => t * t * (3 - 2 * t);
    return (u, v) => {
      const x = u * cells, y = v * cells, x0 = Math.floor(x), y0 = Math.floor(y);
      const sx = sm(x - x0), sy = sm(y - y0);
      const a = G(x0, y0) + (G(x0 + 1, y0) - G(x0, y0)) * sx;
      const b = G(x0, y0 + 1) + (G(x0 + 1, y0 + 1) - G(x0, y0 + 1)) * sx;
      return a + (b - a) * sy;
    };
  }
  function fbm(seed) {
    const a = vnoise(3, seed), b = vnoise(7, seed + 1), c = vnoise(17, seed + 2);
    return (u, v) => 0.62 * a(u, v) + 0.28 * b(u, v) + 0.10 * c(u, v);
  }
  // Flat layered washes with crisp darker tide lines and paper gaps (coffee-stain look).
  function stainTexture(rgb, seed, plain = false) {
    const N = 256, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const c2 = cv.getContext('2d'), img = c2.createImageData(N, N), d = img.data;
    const paper = [246, 241, 230];
    const mix = (p, q, t) => p.map((v, i) => v + (q[i] - v) * t);
    const layers = plain ? [
      { n: fbm(seed), t: 0.0, col: mix(rgb, paper, 0.5), a: 0.9 },
      { n: fbm(seed + 10), t: 0.47, col: mix(rgb, paper, 0.3), a: 0.7 },
    ] : [
      { n: fbm(seed), t: 0.22, col: mix(rgb, paper, 0.55), a: 0.9 },
      { n: fbm(seed + 10), t: 0.49, col: mix(rgb, paper, 0.25), a: 0.8 },
      { n: fbm(seed + 20), t: 0.60, col: rgb.map(v => v * 0.86), a: 0.75 },
    ];
    const edge = rgb.map(v => v * 0.55);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      let c = paper.slice();
      const u = x / N, v = y / N;
      for (const L of layers) {
        const n = L.n(u, v);
        if (n > L.t) {
          c = mix(c, L.col, L.a);
          if (n - L.t < 0.009) c = mix(c, edge, 0.75);   // tide line where the wash dried
        }
      }
      if (x % 3 === 0) c = c.map(v => v * 0.975);       // faint laid-paper lines
      const i = (y * N + x) * 4;
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
    c2.putImageData(img, 0, 0);
    const pat = ctx.createPattern(cv, 'repeat');
    pat.setTransform(new DOMMatrix().scale(0.32));
    return pat;
  }
  const stain = stainTexture(PLAYER_RGB, 7);
  const headStain = stainTexture(PLAYER_RGB, 11, true);  // calmer wash on the blank head so no blotch reads as a face

  // Dry-brush bristle streaks (tileable): bands of parallel hairlines with broken gaps, like a half-loaded brush.
  function dryBrushCanvas(seed) {
    const N = 128, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const c = cv.getContext('2d'), r = rng(seed);
    c.fillStyle = INK;
    const bar = (x, y, w, h) => { for (const ox of [0, -N]) for (const oy of [0, -N]) c.fillRect(x + ox, y + oy, w, h); };
    // one bristle per row: long dark runs broken by small dry gaps, some rows starved of ink
    for (let y = 0; y < N; y += 2.6 + r() * 1.4) {
      const th = 0.9 + r() * 1.5, starve = r() < 0.22;
      let x = r() * N, run = 0;
      while (run < N) {
        const len = starve ? 3 + r() * 14 : 14 + r() * 70, gap = starve ? 6 + r() * 20 : (r() < 0.8 ? 1 + r() * 3 : 6 + r() * 14);
        bar(((x % N) + N) % N, y, len, th);
        x += len + gap; run += len + gap;
      }
    }
    return cv;
  }
  const brushCv = dryBrushCanvas(5);
  const mkBrush = (deg) => { const p = ctx.createPattern(brushCv, 'repeat'); p.setTransform(new DOMMatrix().rotate(deg).scale(0.3)); return p; };
  window.__dbg = { brushCv, get granCv() { return granCv; }, get forming() { return forming; }, get drops() { return drops; } };
  const BRUSH = { limb: mkBrush(90), torso: mkBrush(-62), head: mkBrush(24), foot: mkBrush(4) };

  // Ink granulation for the aura wash: pigment settling unevenly into the paper.
  function granCanvas(seed) {
    const N = 128, cv = document.createElement('canvas'); cv.width = cv.height = N;
    const c = cv.getContext('2d'), img = c.createImageData(N, N), d = img.data, n = fbm(seed), r = rng(seed);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const v = n(x / N, y / N), i = (y * N + x) * 4;
      const a = 0.4 + 0.6 * Math.min(1, Math.max(0, (v - 0.3) / 0.32));
      d[i] = 21; d[i + 1] = 18; d[i + 2] = 15; d[i + 3] = 255 * a * (0.82 + 0.18 * r());
    }
    c.putImageData(img, 0, 0);
    return cv;
  }
  const granCv = granCanvas(19);

  // ---------------------------------------------------------------- fighter parts (rig units, pivot at 0,0, limbs hang along +y)
  // fill = closed silhouette (also drives the liquid aura); ink = inner brush line (joins left open so parts flow together);
  // deco = solid ink marks; thin = fine lines; brush = direction of the dry-brush shading
  const FIST = 'M-4.5,12.5 L-6.5,15.5 L-6.5,21.5 L-4,24.5 L4.5,24.5 L7,21.5 L6.8,15 L4.5,12.5 Z';
  const SRC = {
    torso: {
      fill: 'M-5,1 L-6,-7 L-10,-15 L-12,-22.5 L-7,-27.5 L6,-27.5 L13,-21 L9.5,-12 L5.5,-6 L5,1 Z',
      ink: 'M-5,1 L-6,-7 L-10,-15 L-12,-22.5 L-7,-27.5 L6,-27.5 L13,-21 L9.5,-12 L5.5,-6 L5,1',
      deco: 'M-10.4,-15.5 L-6,-13.5 L-9.4,-11.5 Z',
      thin: 'M13,-21 L4,-17.5 L5.5,-7.5',
      brush: 'torso', shade: 3.2,
    },
    head: {
      // angular helm: visor blade at the front, notched jaw, swept spike rising off the top-back
      fill: 'M-2,0 L9,-1 L18,-7 L14.5,-11 L24.5,-17.5 L14,-27.5 L2,-33 L-9.5,-38.5 L-8,-29 L-13,-20 L-8.5,-8 Z',
      ink: 'M-2,0 L9,-1 L18,-7 L14.5,-11 L24.5,-17.5 L14,-27.5 L2,-33 L-9.5,-38.5 L-8,-29 L-13,-20 L-8.5,-8 Z',
      thin: 'M14.5,-11 L5,-14.5 M14,-27.5 L9,-17.5',
      brush: 'head', shade: 3.8,
    },
    upperArm: {
      fill: 'M-3.8,0 L0,-4.6 L3.8,0 L4.6,8 L3.5,17 L-3.5,17 L-4.6,8 Z',
      ink: 'M-3.8,0 L-4.6,8 L-3.5,17 M3.8,0 L4.6,8 L3.5,17',
      brush: 'limb',
    },
    lowerArm: {
      fill: 'M-3.6,0 L-2,-3.6 L2,-3.6 L3.6,0 L4.6,3 L10.5,0.5 L6.4,6.5 L12,7 L6.8,12.5 L6.8,15 L7,21.5 L4.5,24.5 L-4,24.5 L-6.5,21.5 L-6.5,15.5 L-5.5,13 L-4.6,6 Z',
      ink: 'M-5.5,13 L-4.6,6 L-3.6,0 L-2,-3.6 L2,-3.6 L3.6,0 L4.6,3 L10.5,0.5 L6.4,6.5 L12,7 L6.8,12.5 ' + FIST,
      deco: 'M-6.5,15.5 L-1.5,18 L-0.5,15 L-2.5,17 Z',
      thin: 'M-6.3,18.5 L-1,19.5 L0.5,16 M-2.5,24.3 L-2.5,21.5 M1,24.3 L1,21.5 M4.3,24.3 L4.3,21.5',
      brush: 'limb',
    },
    upperLeg: {
      fill: 'M-5.5,0 L0,-5.5 L5.5,0 L6.2,8 L4.3,17 L-4.3,17 L-6.4,8 Z',
      ink: 'M-5.5,0 L-6.4,8 L-4.3,17 M5.5,0 L6.2,8 L4.3,17',
      deco: 'M-6.2,6 L-2.4,9.5 L-5.8,11 Z',
      brush: 'limb',
    },
    lowerLeg: {   // shin: knee cap on top, open at the ankle so it pours into the foot
      fill: 'M-4.4,0 L-2.4,-4 L2.4,-4 L4.4,0 L4.3,8 L3.4,13.5 L-3.4,13.5 L-4.8,8 Z',
      ink: 'M3.9,10.5 L4.3,8 L4.4,0 L2.4,-4 L-2.4,-4 L-4.4,0 L-4.8,8 L-4.2,10.5',
      deco: 'M4.1,4 L0.6,7.5 L4,8.5 Z',
      brush: 'limb',
    },
    foot: {       // pivot at the ankle so the sole can stay flat while the knee bends
      fill: 'M-4.3,-2.5 L3.9,-2.5 L5.3,1 L16,8 L-4.5,8 L-6.2,4.5 L-4.9,0.5 Z',
      ink: 'M-4.5,-1.5 L-4.9,0.5 L-6.2,4.5 L-4.5,8 L16,8 L5.3,1 L4.5,-1',
      brush: 'foot', shade: 2.2,
    },
  };
  const P2 = (s) => s ? new Path2D(s) : null;
  const PARTS = {};
  for (const [k, v] of Object.entries(SRC)) PARTS[k] = { fill: P2(v.fill), ink: P2(v.ink), deco: P2(v.deco), thin: P2(v.thin), brush: v.brush, shade: v.shade || 2.5 };
  const LEN = { upperArm: 17, upperLeg: 17, lowerLeg: 12 };
  const FIST_C = [0, 19];            // fist centre in lowerArm space
  const SOLE = [[-5, 8], [16, 8]];   // heel, toe in foot space
  const SOLE_TIP = [[-5, 8], [16, 8], [21, 6]];   // plus the pointed toe tip, for the slide

  // ---------------------------------------------------------------- poses (radians; limbs: negative = swing forward)
  // ff/bf = front/back foot angle relative to the ground (positive = toe down)
  const KEYS = ['tl', 'hd', 'fa1', 'fa2', 'ba1', 'ba2', 'fl1', 'fl2', 'bl1', 'bl2', 'ff', 'bf', 'dx', 'sp'];
  const lerp = (a, b, t) => a + (b - a) * t;
  const mixPose = (a, b, t) => { const o = {}; for (const k of KEYS) o[k] = lerp(a[k], b[k], t); return o; };

  // two-bone leg IK: hip -> ankle target (rig units), knee bends forward
  function ik(tx, ty) {
    const L1 = LEN.upperLeg, L2 = LEN.lowerLeg;
    const d = Math.min(L1 + L2 - 0.05, Math.hypot(tx, ty));
    const phi = Math.atan2(-tx, ty);
    const A = Math.acos(Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
    const a1 = phi - A;
    const kx = -Math.sin(a1) * L1, ky = Math.cos(a1) * L1;
    return [a1, Math.atan2(-(tx - kx), ty - ky) - a1];
  }

  // Fighting stance: feet planted wide, knees sink and spring back in a steady bounce; guard and head follow a beat late.
  const BOB_W = 7.4;
  function idlePose(t, deep = 0) {
    const ph = t * BOB_W;
    const b = 0.5 - 0.5 * Math.cos(ph);            // 0 = top of the bounce, 1 = deepest knee bend
    const bl = 0.5 - 0.5 * Math.cos(ph - 0.75);    // the upper body lags behind the legs
    const D = 26 - 2.8 * b * (1 - deep * 0.6) - 14.5 * deep;   // hip-to-ankle height (deep = crouch)
    const [fl1, fl2] = ik(8.5, D);                 // front foot ahead, knee over the toes
    const [bl1, bl2] = ik(-12.5, D);               // back foot braced behind
    return { tl: 0.15 + 0.05 * bl + 0.42 * deep, hd: -0.08 - 0.05 * bl - 0.3 * deep,
      fa1: -0.72 + 0.08 * bl, fa2: -1.6 - 0.14 * bl, ba1: -0.2 + 0.07 * bl, ba2: -2.05 - 0.1 * bl,
      fl1, fl2, bl1, bl2, ff: 0, bf: 0, dx: 0, sp: 0 };
  }
  // first steps: an upright, guarded walk
  function walkPose(p) {
    const leg = (q) => [-(0.05 + 0.45 * Math.sin(q)), 0.15 + 0.75 * Math.max(0, Math.cos(q - 0.4)),
      0.3 * Math.max(0, -Math.sin(q - 0.5)) - 0.08 * Math.max(0, Math.sin(q))];
    const [f1, f2, f3] = leg(p), [b1, b2, b3] = leg(p + Math.PI);
    return { tl: 0.12, hd: -0.1,
      fa1: -0.65 + 0.28 * Math.sin(p), fa2: -1.7, ba1: -0.2 - 0.28 * Math.sin(p), ba2: -2.0,
      fl1: f1, fl2: f2, bl1: b1, bl2: b2, ff: f3, bf: b3, dx: 0, sp: 0 };
  }
  // full sprint: deep lean with the head driving forward, high knee drive, heel kicked up behind,
  // arms swept straight back and streamlined
  function sprintPose(p) {
    const leg = (q) => [-(0.15 + 1.1 * Math.sin(q)), 0.35 + 1.95 * Math.max(0, Math.cos(q - 0.55)),
      0.65 * Math.max(0, -Math.sin(q - 0.5)) - 0.1 * Math.max(0, Math.sin(q))];
    const [f1, f2, f3] = leg(p), [b1, b2, b3] = leg(p + Math.PI);
    return { tl: 0.62 + 0.03 * Math.sin(2 * p), hd: -0.42,
      fa1: 0.62 + 0.1 * Math.sin(p), fa2: -0.12, ba1: 0.8 - 0.1 * Math.sin(p), ba2: -0.08,
      fl1: f1, fl2: f2, bl1: b1, bl2: b2, ff: f3, bf: b3, dx: 0, sp: 0 };
  }
  const FLIP_T = 0.5;
  const TUCK = { tl: 0.45, hd: 0.25, fa1: -1.35, fa2: -1.7, ba1: -1.05, ba2: -1.9, fl1: -1.95, fl2: 2.35, bl1: -1.6, bl2: 2.25, ff: 0.3, bf: 0.3, dx: 0, sp: 0 };
  const AIRDASH = { tl: 0.15, hd: -0.2, fa1: 0.5, fa2: -0.1, ba1: 0.7, ba2: -0.1, fl1: 0.25, fl2: 0.5, bl1: 0.55, bl2: 0.35, ff: 0.6, bf: 0.7, dx: 0, sp: 0 };
  // slide: leaning back, lead leg shot out flat along the floor, back leg tucked, trailing hand down
  const SLIDE = { tl: -0.55, hd: 0.3, fa1: -1.0, fa2: -1.55, ba1: 1.25, ba2: -1.5, fl1: -1.45, fl2: 0.15, bl1: -1.4, bl2: 2.75, ff: -0.25, bf: 0, dx: 0, sp: 0 };
  // fast fall: lead foot stamped straight down, toe pointed, other knee tucked up, guard held tight
  const FASTFALL = { tl: -0.04, hd: 0.05, fa1: -1.0, fa2: -1.85, ba1: -0.55, ba2: -2.1, fl1: 0.12, fl2: 0.05, bl1: -1.35, bl2: 2.15, ff: 1.25, bf: 0.5, dx: 0, sp: 0 };
  const JUMP = { tl: 0.24, hd: -0.12, fa1: -0.85, fa2: -1.75, ba1: -0.3, ba2: -2.0, fl1: -1.35, fl2: 1.75, bl1: -0.25, bl2: 1.25, ff: 0.45, bf: 0.6, dx: 0, sp: 0 };
  const FALL = { tl: 0.1, hd: -0.04, fa1: -1.05, fa2: -1.45, ba1: 0.05, ba2: -1.9, fl1: -0.55, fl2: 0.45, bl1: 0.35, bl2: 0.55, ff: 0.2, bf: 0.3, dx: 0, sp: 0 };

  // ---------------------------------------------------------------- player
  const RUN = 330, ACC_G = 2600, ACC_A = 1500, FRICTION = 2900, GRAV = 2000, JUMP_V = 885, MAX_FALL = 1250, FAST_FALL = 1400;
  // wall slide: starts slow, speeds up the longer you're off the ground (time on the wall adds up until you land)
  // wall jump: hold toward the wall to jump up it, anything else kicks off it.
  // Once the slide gets fast enough (lock) you can't jump off the wall any more; from warn up to lock, sparks fly off the hands
  // and feet, yellow turning red as the lock gets close.
  const WALL_SLIDE = { v0: 70, acc: 190, max: 900, brake: 2600, grip: 0.1, warn: 380, lock: 560 };   // px/s, px/s per second on the wall, cap, how fast a fall is caught, jump grace (s), sparks start, no more wall jumps
  const WALL_JUMP = { v: 820, offVx: 430, upVx: 150 };
  // wall slide: facing the wall and pressed up against it, both fists flat on it, lead foot braced on it, rear knee tucked under
  const WALLSLIDE = { tl: 0.18, hd: 0.18, fa1: -2.26, fa2: -0.31, ba1: -1.7, ba2: -0.92, fl1: -1.46, fl2: 1.04, bl1: -0.26, bl2: 1.64, ff: -0.31, bf: 0.5, dx: 0, sp: 0 };
  // ---- attacks. Every move: limb = the hitbox chain (fa/ba arms, fl/bl legs), wind = telegraphed wind-up,
  // act = live hit frames, link = earliest the next hit of a string can start (9 = ends the string), end = recovery over,
  // stun = hitstun, damage = % added, kb/pop = launch (sideways / upwards, negative pop = spiked down),
  // ragdoll = kill blow (launch grows with damage), jc = on hit you can jump out of the recovery,
  // air moves: float = nudge toward their direction on the strike, gravW/gravK = gravity while winding / striking.
  // pose(phase, target) sets the body for phase 0 wind / 1 strike / 2 recovery and returns how fast it snaps there.

  // ---------------------------------------------------------------- bottom HUD: a round ink portrait of every fighter in play, damage % over it
  const HUD_R = 38, HUD_Y = 652, PAPER = '#f3ecdd';
  // the frame is one loaded dry-brush stroke laid round the portrait: a bold start, the tail lapping over it,
  // then the brush runs dry and splinters into broken hairlines
  function hudRing(cx, cy, r, seed) {
    const rr = rng(seed), a0 = -2.6 + rr() * 0.5, sweep = TAU + 0.5, n = 32, pts = [], out = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, a = a0 + sweep * t, rad = r + Math.sin(t * 9 + seed) * 0.6 + t * 1.4;
      pts.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]);
    }
    out.push({ p: brushPath(pts, 7.5, 0.04, 0.4, 0.9, seed), a: 1 });
    const inner = [];   // a pale second pass just inside, like the brush dragged round twice
    for (let i = 0; i <= 24; i++) { const a = a0 + 1.4 + 3.6 * i / 24; inner.push([cx + Math.cos(a) * (r - 4.5), cy + Math.sin(a) * (r - 4.5)]); }
    out.push({ p: brushPath(inner, 2.6, 0.2, 0.5, 0.4, seed + 3), a: 0.22 });
    const aT = a0 + sweep;
    for (let k = 0; k < 7; k++) {
      const off = (k - 3) * 1.1 + (rr() - 0.5) * 0.6, s0 = aT - 0.7 - rr() * 0.35, e0 = aT + 0.05 + rr() * 0.32;
      let a = s0;

        for (let j = 0; j <= 4; j++) {

          const rad = r + 1.4 + off * fan;

        out.push({ p: brushPath(q, 0.8 + rr() * 0.9, 0.15, 0.5, 0.2, seed + k * 13 + j0(a)), a: 0.92 });
        a = e + 0.03 + rr() * 0.13;
      }

      const a = aT + 0.25 + rr() * 0.3, rad = r + 1.4 + (rr() - 0.5) * 4, p = new Path2D();
      p.arc(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, 0.7 + rr() * 0.9, 0, TAU);
      out.push({ p, a: 0.85 });

  }
  const j0 = (a) => Math.round(a * 100);
  const HUD = [
    { f: () => pl, x: GW / 2 - 100, face: 1, st: stain, hs: headStain, seed: 41 },
    { f: () => bot, x: GW / 2 + 100, face: -1, st: botStain, hs: botHeadStain, seed: 57 },
  ];
  for (const h of HUD) { h.ring = hudRing(h.x, HUD_Y, HUD_R, h.seed); h.last = 0; h.popT = -9; }
  const BUST = { s: 1.12, tl: 0.08, hd: -0.06 };
  const redInk = (k) => `rgb(${Math.round(21 + 129 * k)},${Math.round(18 + 10 * k)},${Math.round(15 + 7 * k)})`;
  function drawPortrait(h) {
    const f = h.f(), d = f.damage || 0, out = f.dead > 0 || !!f.out, t = f.time || 0, d01 = Math.min(1, d / KO_DAMAGE);
    if (d > h.last + 0.01) h.popT = t;   // took a hit: the portrait jolts and the number swells

      ctx.font = `italic 700 ${(big * 0.55).toFixed(1)}px Georgia, serif`; ctx.lineWidth = 5; ctx.strokeText('%', x0 + wN + 2, by); ctx.fillText('%', x0 + wN + 2, by);

  // ---------------------------------------------------------------- Divine General (Ancient companion): a boss that fights for whoever holds his card

  // to beat him 1v1 while the owner waits. He plays himself. He's huge and very tanky: hits barely move him and nothing

    walk: 115,       // px/s

    cleave:   { tele: 0.42, act: 0.12, rec: 0.55, dmg: 14, kb: 640, pop: 320, lunge: 70, tip: 'blade' },   // forward: the arm blade swept flat across
    backhand: { tele: 0.32, act: 0.10, rec: 0.45, dmg: 11, kb: 560, pop: 260, tip: 'backFist' },           // behind: a spinning backhand
    heaven:   { tele: 0.38, act: 0.14, rec: 0.60, dmg: 13, kb: 120, pop: 980, tip: 'blade' },              // up: the blade driven straight up

    ctx.textAlign = 'right'; ctx.font = 'italic 600 15px Georgia, serif'; ctx.fillStyle = 'rgba(21,18,15,0.5)';   // more rows above / below
    const mx = CSHEET.x1 - 30;
    if (cards.scroll > 0) ctx.fillText('▲ more', mx, GAL.y + 14);
    if (cards.scroll + GAL.rows < rowsAll) ctx.fillText('more ▼', mx, GAL.y + 2 * GAL.h + GAL.gap - 4);
    g.slice(first, first + GAL.cols * GAL.rows).forEach((c, j) => {
      const i = first + j, x = GAL.x + (j % GAL.cols) * (GAL.w + GAL.gap), f = cards.row === R_GAL && cards.col === i, y = GAL.y + Math.floor(j / GAL.cols) * (GAL.h + GAL.gap) + (f ? -4 : 0);
      cardFace(c, x, y, GAL.w, GAL.h, f, 700 + i * 5);
      if (isEquipped(c)) { ctx.textAlign = 'center'; ctx.font = 'italic 700 12px Georgia, serif'; ctx.lineJoin = 'round'; ctx.strokeStyle = PAPER; ctx.lineWidth = 3; ctx.strokeText('equipped', x + GAL.w / 2, y + 17); ctx.fillStyle = INK; ctx.fillText('equipped', x + GAL.w / 2, y + 17); }
      if (f) focusTick(x - 10, y + GAL.h / 2, 800 + i);
      hits.push({ row: R_GAL, col: i, x0: x, y0: y, x1: x + GAL.w, y1: y + GAL.h });
    });
  }

  // ---------------------------------------------------------------- home menu: the game opens here
  const HOME_ITEMS = [{ label: 'Practice Tool', act: () => startPractice() }];
  const game = { mode: 'home' };
  const home = { sel: 0, t: 0, selT: 0 };
  window.__game = game;
  function startPractice() { game.mode = 'practice'; pressed.clear(); if (!round.started) resetRound(); }
  function goHome() { game.mode = 'home'; home.sel = 0; home.selT = 0; pressed.clear(); }
  window.__startPractice = startPractice;   // test hook: skip the home menu
  const HROW0 = 430, HROW = 52;
  function homeStep(dt) {
    home.t += dt; home.selT += dt;
    const P = (a) => pressed.has(a), n = HOME_ITEMS.length;
    if (P('up')) { home.sel = (home.sel + n - 1) % n; home.selT = 0; }
    if (P('down')) { home.sel = (home.sel + 1) % n; home.selT = 0; }
    if (P('ok') || P('punch')) HOME_ITEMS[home.sel].act();
    pressed.clear();
  }
  function homeRowAt(x, y) {
    if (x < GW / 2 - 200 || x > GW / 2 + 200) return -1;
    const i = Math.round((y - HROW0) / HROW);
    return i >= 0 && i < HOME_ITEMS.length && Math.abs(y - (HROW0 + i * HROW)) < HROW / 2 ? i : -1;
  }
  function homeHover(x, y) { const i = homeRowAt(x, y); if (i >= 0 && i !== home.sel) { home.sel = i; home.selT = 0; } }
  function homeClick(x, y) { const i = homeRowAt(x, y); if (i >= 0) { home.sel = i; HOME_ITEMS[i].act(); } }
  let homeBg = null, homeBgKey = '';
  function drawHome() {
    const key = canvas.width + 'x' + canvas.height;
    if (key !== homeBgKey) {   // plain sheet of paper with grain, built once per size
      homeBgKey = key; homeBg = document.createElement('canvas'); homeBg.width = canvas.width; homeBg.height = canvas.height;
      const b = homeBg.getContext('2d'), r = rng(41), k = view.s * view.dpr;
      b.fillStyle = '#ece4d3'; b.fillRect(0, 0, homeBg.width, homeBg.height);
      b.fillStyle = 'rgba(90,70,45,0.05)';
      for (let i = 0; i < 9000; i++) b.fillRect(r() * homeBg.width, r() * homeBg.height, 1.2 * k, 1.2 * k);
      b.fillStyle = 'rgba(90,70,45,0.035)';
      for (let x = 0; x < homeBg.width; x += 3 * k) b.fillRect(x, 0, k, homeBg.height);   // laid-paper lines
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(homeBg, 0, 0);
    SHX = SHY = 0; setM(ID);
    // title: big italic ink, a loaded brush stroke under it that runs dry into bristle hairlines
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.font = 'italic 700 104px Georgia, serif'; ctx.fillStyle = INK;
    ctx.fillText('Ink Fighter', GW / 2, 270);
    const tw = ctx.measureText('Ink Fighter').width, l = GW / 2 - tw / 2;
    ctx.fill(brushPath([[l - 10, 300], [l + tw * 0.35, 303], [l + tw * 0.75, 299], [l + tw + 14, 301]], 13, 0.03, 0.45, 0.8, 901));
    const r = rng(905);
    for (let h = 0; h < 6; h++) {   // the dry tail splitting into bristles
      const y = 296 + h * 1.9, x0 = l + tw * (0.62 + r() * 0.1);
      ctx.fill(brushPath([[x0, y], [l + tw + 30 + r() * 30, y + (r() - 0.5) * 3], [l + tw + 50 + r() * 50, y + (r() - 0.3) * 5]], 1.3, 0.05, 0.6, 0.1, 910 + h));
    }
    HOME_ITEMS.forEach((it, i) => {
      const y = HROW0 + i * HROW, on = i === home.sel;
      ctx.font = `italic ${on ? 700 : 600} 32px Georgia, serif`; ctx.fillStyle = on ? INK : 'rgba(21,18,15,0.6)';
      ctx.fillText(it.label, GW / 2, y + 10);
      if (on) {
        const w = ctx.measureText(it.label).width, g = Math.min(1, home.selT / 0.14);
        ctx.fill(brushPath([[GW / 2 - w / 2 - 4, y + 20], [GW / 2 - w / 2 + w * 0.5 * g, y + 21], [GW / 2 - w / 2 + (w + 8) * g, y + 19]], 4, 0.05, 0.55, 0.3, 920 + i));
        focusTick(GW / 2 - w / 2 - 26, y, 930 + i);
      }
    });
    ctx.font = 'italic 500 17px Georgia, serif'; ctx.fillStyle = 'rgba(21,18,15,0.5)';
    ctx.fillText('Enter, Space or A to start', GW / 2, 640);
  }

  // ---------------------------------------------------------------- loop
  R0 = rig(); auraUpdate(R0, 0); bot.R = rig(bot); botInk(bot.R);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (!pl.paused) {   // paused = a test is stepping frames by hand
      if (game.mode === 'home') { pollPad(); homeStep(dt); drawHome(); }
      else { if (menu.open) { pollPad(); menuStep(dt); } else update(dt); draw(); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
